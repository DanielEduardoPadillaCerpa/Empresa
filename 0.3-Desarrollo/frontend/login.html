<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="login_page_title">Iniciar sesión — Suministros Institucionales</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-institucional py-3">
  <div class="container">
    <a class="navbar-brand" href="landing.html">
      <span data-i18n="nav_brand">Suministros Institucionales</span>
      <span class="badge-code" data-i18n="nav_badge">PROVEEDOR AUTORIZADO · REG-2026-0417</span>
    </a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto gap-lg-3">
        <li class="nav-item"><a class="nav-link" href="index.html" data-i18n="nav_catalogo">Catálogo</a></li>
        <li class="nav-item dropdown selector-idioma"></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container py-5 d-flex justify-content-center">
  <div style="max-width:420px; width:100%;">
    <div class="text-center mb-4">
      <div class="eyebrow mb-2" data-i18n="login_eyebrow">Acceso de cliente</div>
      <h1 class="display-serif h3" data-i18n="login_title">Iniciar sesión</h1>
      <p class="text-muted small" data-i18n="login_lead">Necesitas una cuenta para completar tu compra.</p>
    </div>

    <form id="form-login" novalidate>
      <div class="mb-3">
        <label class="form-label" data-i18n="login_email">Correo electrónico</label>
        <input type="email" id="loginCorreo" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label" data-i18n="login_password">Contraseña</label>
        <input type="password" id="loginPassword" class="form-control" required>
      </div>
      <div class="form-check mb-2">
        <input class="form-check-input" type="checkbox" id="captchaHumano" required>
        <label class="form-check-label" data-i18n="login_human_check">Soy humano (captcha)</label>
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="aceptaTerminos" required>
        <label class="form-check-label" data-i18n="login_terms_check">Acepto los términos y condiciones</label>
      </div>
      <div id="login-mensaje" class="mb-3" style="display:none;"></div>
      <button type="submit" id="btn-login" class="btn btn-dark w-100" data-i18n="login_submit">Iniciar sesión</button>
    </form>


    <p class="text-center small text-muted mt-3">
      <span data-i18n="login_no_account">¿No tienes cuenta?</span> <a href="registro.html" data-i18n="login_register_link">Regístrate aquí</a>
    </p>
    <p class="text-center small">
      <label class="text-muted" data-i18n="login_backend_url">URL del backend:</label>
      <input type="text" id="apiBase" class="form-control form-control-sm d-inline-block" style="max-width:260px;" value="http://localhost:8080">
    </p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/i18n.js"></script>
<script src="js/auth.js"></script>
<script src="js/navbar.js"></script>

<script>
const form = document.getElementById('form-login');
const btn = document.getElementById('btn-login');
const mensaje = document.getElementById('login-mensaje');

function mostrarMensaje(texto, tipo) {
  mensaje.textContent = texto;
  mensaje.className = 'mb-3 alert alert-' + tipo;
  mensaje.style.display = 'block';
}

// Si ya está logueado, no tiene sentido quedarse en esta página
if (authEstaLogueado()) {
  const params = new URLSearchParams(window.location.search);
  const sesionActual = authLeer();
  const destinoPorRol = sesionActual?.rol === 'admin' ? 'admin-dashboard.html' : 'index.html';
  window.location.href = params.get('redirect') || destinoPorRol;
}

form.addEventListener('submit', async function (e) {
  e.preventDefault();
  const apiBase = document.getElementById('apiBase').value.replace(/\/$/, '');
  const correo = document.getElementById('loginCorreo').value.trim();
  const password = document.getElementById('loginPassword').value;
  const captchaHumano = document.getElementById('captchaHumano').checked;
  const aceptaTerminos = document.getElementById('aceptaTerminos').checked;

  if (!captchaHumano || !aceptaTerminos) {
    mostrarMensaje('Debes aceptar términos y confirmar que eres humano', 'danger');
    return;
  }

  btn.disabled = true;

  try {
    const resp = await fetch(apiBase + '/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ correo, password, captchaHumano })
    });
    const datos = await resp.json();
    if (!resp.ok) throw new Error(datos.error || 'No se pudo iniciar sesión');

    authGuardar(datos);

    // El administrador entra directo al panel administrativo (requisito:
    // "accede directamente al Dashboard administrativo"); el cliente al catálogo.
    const params = new URLSearchParams(window.location.search);
    const destinoPorRol = datos?.rol === 'admin' ? 'admin-dashboard.html' : 'index.html';
    window.location.href = params.get('redirect') || destinoPorRol;
  } catch (err) {
    mostrarMensaje(err.message, 'danger');
    btn.disabled = false;
    aplicarIdioma(idiomaGuardado());
  }
});
</script>
</body>
</html>
